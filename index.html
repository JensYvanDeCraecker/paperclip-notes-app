<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <link rel="stylesheet" href="src/client/notes.css">
</head>
<body>
  <main class="workspace">
    <section class="browsing" aria-label="Notes">
      <header>
        <h1>Notes</h1>
        <p class="secondary">Stored in this browser</p>
        <button class="primary" id="new-note" disabled>New note</button>
        <label for="search">Search notes</label>
        <input id="search" type="search" placeholder="Search title or body" disabled>
        <button id="clear-search" hidden>Clear search</button>
        <p id="count" role="status"></p>
      </header>
      <div id="note-list" class="note-list" aria-busy="true">
        <p role="status">Loading your notes…</p>
      </div>
    </section>
    <section class="editor" aria-label="Note editor">
      <div id="idle" class="idle">
        <h2>Choose a note</h2>
        <p>Open a note or create a new one.</p>
        <button class="primary" disabled>New note</button>
      </div>
      <form id="note-form" hidden>
        <div class="editor-bar">
          <button id="back" type="button" class="mobile-only">Back to notes</button>
          <span id="context">New note</span>
          <span id="save-status" role="status">Unsaved changes</span>
          <button id="delete" type="button" hidden>Delete note</button>
        </div>
        <div class="editor-content">
          <label for="title">Title</label>
          <input id="title" placeholder="Untitled note">
          <label for="body">Body</label>
          <textarea id="body" placeholder="Start writing…"></textarea>
          <button id="save" class="primary" disabled>Save note</button>
          <p id="save-help">Add a title or some text to save your note.</p>
          <p id="save-error" role="alert" hidden></p>
        </div>
      </form>
    </section>
  </main>
  <dialog id="confirmation" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <h2 id="dialog-title"></h2>
    <p id="dialog-description"></p>
    <p id="dialog-error" role="alert" hidden></p>
    <div id="dialog-actions" class="dialog-actions"></div>
  </dialog>
  <p id="announcement" class="sr-only" role="status"></p>
</body>
</html>
